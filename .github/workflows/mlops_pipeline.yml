name: Automatic MLOps Pipeline

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mlops:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy scikit-learn xgboost mlflow evidently kaggle

      - name: Download Kaggle dataset
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          kaggle datasets download -d sriharshaeedala/financial-fraud-detection-dataset -p .

      - name: Preprocess dataset
        run: |
          python preprocess_data.py

      - name: Run MLOps pipeline
        run: |
          python run_mlops_pipeline.py

      - name: Persist promoted production model
        run: |
          if git diff --quiet -- models/xgboost_fraud_model_production.json; then
            echo "No production model promotion to persist."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/xgboost_fraud_model_production.json
          git commit -m "Persist promoted production model"
          git push
